<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Single Page Apps for GitHub Pages</title>
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/' ) {
        var p = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        });
        if (p[0] !== l.pathname) {
          history.replaceState(null, null,
            l.pathname.slice(0, -1) + p[0] + p.slice(1).join('')
          );
        }
      }
    })(window.location);
  </script>
</head>

</body>
</html>
